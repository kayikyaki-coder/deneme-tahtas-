<!doctype html>
<html><head><meta charset="utf-8"><title>Hayırlı Cumalar</title>
<style>
@font-face{font-family:Amiri;src:url(fonts/Amiri-Bold.ttf);font-weight:700}
@font-face{font-family:Corm;src:url(fonts/Cormorant.ttf);font-weight:300 700}
@font-face{font-family:Corm;src:url(fonts/CormorantItalic.ttf);font-weight:300 700;font-style:italic}
html,body{margin:0;background:#000}
</style></head>
<body><canvas id="c" width="1080" height="1080"></canvas>
<script>
const S = 1080, FPS = 60, FRAMES = 300;
const GOLD = '#D4AF37', GOLD_HI = '#F5D98B', GOLD_LO = '#8A6A1F', IVORY = '#F4EDE0';
const cv = document.getElementById('c'), ctx = cv.getContext('2d', { willReadFrequently: true });
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const seg = (t, a, b) => clamp((t - a) / (b - a));
const io3 = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
const oE = (t) => (t >= 1 ? 1 : 1 - Math.pow(2, -10 * t));
const oB = (t) => 1 + 2.2 * Math.pow(t - 1, 3) + 1.2 * Math.pow(t - 1, 2);
const lerp = (a, b, t) => a + (b - a) * t;
function rng(a) { return () => { a |= 0; a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }

// ---- 8-fold star-and-cross tiling as individual segments, revealed from the centre outward
const CX = 540, CY = 520;
const SEGS = [];
{
  const s = 150, R = 0.54 * s, r = R * 0.765;
  for (let gy = -5; gy <= 5; gy++) for (let gx = -5; gx <= 5; gx++) {
    const ox = CX + gx * s, oy = CY + gy * s;
    const pts = [];
    for (let k = 0; k < 16; k++) { const a = (k * Math.PI) / 8 + Math.PI / 16; const rr = k % 2 ? r : R; pts.push([ox + Math.cos(a) * rr, oy + Math.sin(a) * rr]); }
    for (let k = 0; k < 16; k++) {
      const a = pts[k], b = pts[(k + 1) % 16];
      const mx = (a[0] + b[0]) / 2, my = (a[1] + b[1]) / 2;
      SEGS.push({ a, b, d: Math.hypot(mx - CX, my - CY), dir: k % 2 });
    }
  }
  SEGS.sort((p, q) => p.d - q.d);
}
// light motes + glints
const R0 = rng(7);
const MOTES = Array.from({ length: 80 }, () => ({ x: R0() * S, y: R0() * S, v: 12 + R0() * 30, s: 0.8 + R0() * 2.2, ph: R0() * 6.28, a: 0.25 + R0() * 0.6 }));
const GLINTS = [[300, 420, 2.25], [790, 640, 2.7], [250, 700, 3.1], [860, 330, 3.45], [540, 250, 1.95], [700, 470, 3.8]];

function starPath(x, y, R, r, n, rot) {
  ctx.beginPath();
  for (let k = 0; k < n * 2; k++) { const a = rot + (k * Math.PI) / n; const rr = k % 2 ? r : R; const px = x + Math.cos(a) * rr, py = y + Math.sin(a) * rr; k ? ctx.lineTo(px, py) : ctx.moveTo(px, py); }
  ctx.closePath();
}

function goldGrad(y0, y1) {
  const g = ctx.createLinearGradient(0, y0, 0, y1);
  g.addColorStop(0, GOLD_HI); g.addColorStop(0.5, GOLD); g.addColorStop(1, GOLD_LO);
  return g;
}

function lantern(x, t, t0, len, phase) {
  const drop = oB(clamp((t - t0) / 0.7));
  if (drop <= 0) return;
  const sw = Math.sin(t * 2.1 + phase) * 0.05 * (0.4 + 0.6 * Math.exp(-(t - t0) * 0.8)) + (1 - clamp((t - t0) / 0.7)) * 0.15;
  ctx.save();
  ctx.translate(x, -20);
  ctx.rotate(sw);
  const L = len * drop;
  ctx.strokeStyle = 'rgba(212,175,55,0.7)'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, L); ctx.stroke();
  ctx.translate(0, L);
  // glow
  const gl = 0.55 + 0.1 * Math.sin(t * 7 + phase);
  const g = ctx.createRadialGradient(0, 45, 0, 0, 45, 170);
  g.addColorStop(0, `rgba(255,200,110,${0.45 * gl})`); g.addColorStop(1, 'rgba(255,200,110,0)');
  ctx.globalCompositeOperation = 'lighter';
  ctx.fillStyle = g; ctx.fillRect(-170, -125, 340, 340);
  ctx.globalCompositeOperation = 'source-over';
  // body: cap, glass (ogee), base
  ctx.fillStyle = goldGrad(0, 100);
  ctx.beginPath(); ctx.moveTo(-6, 0); ctx.lineTo(6, 0); ctx.lineTo(18, 16); ctx.lineTo(-18, 16); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(-18, 16); ctx.bezierCurveTo(-34, 36, -34, 64, -16, 82); ctx.lineTo(16, 82); ctx.bezierCurveTo(34, 64, 34, 36, 18, 16); ctx.closePath();
  const gg = ctx.createRadialGradient(0, 48, 2, 0, 48, 34);
  gg.addColorStop(0, '#FFF3C9'); gg.addColorStop(0.5, '#F2B851'); gg.addColorStop(1, '#9A5A12');
  ctx.fillStyle = gg; ctx.fill();
  ctx.strokeStyle = GOLD; ctx.lineWidth = 2; ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0, 16); ctx.lineTo(0, 82); ctx.moveTo(-26, 49); ctx.lineTo(26, 49); ctx.strokeStyle = 'rgba(138,106,31,0.8)'; ctx.lineWidth = 1.5; ctx.stroke();
  ctx.fillStyle = goldGrad(80, 100);
  ctx.beginPath(); ctx.moveTo(-16, 82); ctx.lineTo(16, 82); ctx.lineTo(6, 96); ctx.lineTo(-6, 96); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(0, 96); ctx.lineTo(0, 112); ctx.stroke();
  ctx.restore();
}

function mosque(t) {
  const k = io3(seg(t, 1.25, 2.35));
  if (k <= 0) return;
  ctx.save();
  ctx.translate(0, (1 - k) * 180);
  ctx.globalAlpha = k;
  const base = 1080, cx = 540;
  ctx.beginPath();
  // ground
  ctx.moveTo(0, base); ctx.lineTo(0, 985); ctx.lineTo(1080, 985); ctx.lineTo(1080, base); ctx.closePath();
  // main hall + dome
  ctx.rect(330, 900, 420, 100);
  ctx.moveTo(380, 905); ctx.bezierCurveTo(380, 790, 450, 745, cx, 742); ctx.bezierCurveTo(630, 745, 700, 790, 700, 905); ctx.closePath();
  ctx.rect(cx - 3, 712, 6, 32);
  // half domes
  for (const sx of [-1, 1]) {
    const hx = cx + sx * 205;
    ctx.moveTo(hx - 70, 935); ctx.bezierCurveTo(hx - 70, 880, hx - 35, 862, hx, 860); ctx.bezierCurveTo(hx + 35, 862, hx + 70, 880, hx + 70, 935); ctx.closePath();
    ctx.rect(hx - 75, 930, 150, 70);
    // minarets
    const mx = cx + sx * 345;
    ctx.rect(mx - 11, 690, 22, 300);
    ctx.rect(mx - 17, 790, 34, 10);
    ctx.rect(mx - 15, 712, 30, 8);
    ctx.moveTo(mx - 11, 690); ctx.lineTo(mx, 600); ctx.lineTo(mx + 11, 690); ctx.closePath();
  }
  ctx.save();
  ctx.shadowColor = 'rgba(212,175,55,0.55)'; ctx.shadowBlur = 26;
  ctx.fillStyle = '#040A16'; ctx.fill();
  ctx.restore();
  ctx.fillStyle = '#040A16'; ctx.fill();
  // golden rim light along the silhouette
  ctx.save(); ctx.clip();
  const rim = ctx.createLinearGradient(0, 600, 0, 1000);
  rim.addColorStop(0, 'rgba(212,175,55,0.25)'); rim.addColorStop(0.35, 'rgba(212,175,55,0.05)'); rim.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = rim; ctx.fillRect(0, 590, 1080, 500);
  ctx.restore();
  // glowing arched windows
  const wl = seg(t, 2.0, 2.6);
  ctx.globalCompositeOperation = 'lighter';
  for (let i = -3; i <= 3; i++) {
    const wx = cx + i * 46, wy = 935;
    const g = ctx.createRadialGradient(wx, wy + 10, 0, wx, wy + 10, 40);
    g.addColorStop(0, `rgba(255,190,90,${0.5 * wl})`); g.addColorStop(1, 'rgba(255,190,90,0)');
    ctx.fillStyle = g; ctx.fillRect(wx - 40, wy - 30, 80, 80);
    ctx.fillStyle = `rgba(255,214,140,${0.85 * wl})`;
    ctx.beginPath(); ctx.moveTo(wx - 9, wy + 30); ctx.lineTo(wx - 9, wy + 4); ctx.quadraticCurveTo(wx - 9, wy - 10, wx, wy - 14); ctx.quadraticCurveTo(wx + 9, wy - 10, wx + 9, wy + 4); ctx.lineTo(wx + 9, wy + 30); ctx.closePath(); ctx.fill();
  }
  ctx.globalCompositeOperation = 'source-over';
  ctx.restore();
}

function draw(t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over'; ctx.filter = 'none';
  // night sky
  const bg = ctx.createRadialGradient(CX, 430, 40, CX, 520, 820);
  bg.addColorStop(0, '#173263'); bg.addColorStop(0.45, '#0B1D3A'); bg.addColorStop(1, '#03070F');
  ctx.fillStyle = bg; ctx.fillRect(0, 0, S, S);
  // slow camera push for life
  const push = 1.06 - 0.06 * io3(seg(t, 0, 5));
  ctx.translate(CX, CY); ctx.scale(push, push); ctx.translate(-CX, -CY);

  // pattern draws itself
  const dim = lerp(1, 0.55, seg(t, 2.0, 2.8));
  ctx.lineCap = 'round';
  for (const pass of [0, 1]) {
    ctx.strokeStyle = pass ? `rgba(245,217,139,${0.32 * dim})` : `rgba(212,175,55,${0.07 * dim})`;
    ctx.lineWidth = pass ? 1.3 : 5;
    ctx.beginPath();
    for (const sg of SEGS) {
      const p = io3(seg(t, 0.12 + (sg.d / 800) * 1.25, 0.12 + (sg.d / 800) * 1.25 + 0.4));
      if (p <= 0) break;
      const fade = clamp(1.25 - sg.d / 720);
      if (fade <= 0) continue;
      const [a, b] = sg.dir ? [sg.b, sg.a] : [sg.a, sg.b];
      ctx.moveTo(a[0], a[1]);
      ctx.lineTo(lerp(a[0], b[0], p), lerp(a[1], b[1], p));
    }
    ctx.stroke();
  }
  // vignette mask on pattern edges (draw dark radial)
  const vg = ctx.createRadialGradient(CX, CY, 260, CX, CY, 760);
  vg.addColorStop(0, 'rgba(3,7,15,0)'); vg.addColorStop(1, 'rgba(3,7,15,0.85)');
  ctx.fillStyle = vg; ctx.fillRect(-100, -100, S + 200, S + 200);

  // central rosette unfolding behind the title
  const ru = io3(seg(t, 0.6, 1.9));
  if (ru > 0) {
    ctx.save();
    ctx.globalAlpha = 0.9 * ru;
    const rot = (1 - ru) * (Math.PI / 8) + t * 0.04;
    const sc = lerp(0.8, 1, ru);
    for (const [R, r, w, a] of [[330, 250, 1.6, 0.3], [300, 230, 1, 0.18]]) {
      starPath(CX, CY - 10, R * sc, r * sc, 8, rot);
      ctx.strokeStyle = `rgba(212,175,55,${a})`; ctx.lineWidth = w; ctx.stroke();
    }
    ctx.beginPath(); ctx.arc(CX, CY - 10, 345 * sc, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(212,175,55,0.25)'; ctx.lineWidth = 1; ctx.stroke();
    ctx.restore();
  }

  // crescent with bloom
  const cr = seg(t, 1.55, 2.2);
  if (cr > 0) {
    const ce = oE(cr);
    const x = CX, y = 205 + (1 - ce) * 30;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    const bl = ctx.createRadialGradient(x, y, 0, x, y, 210);
    const flare = 0.35 * Math.exp(-Math.max(0, t - 1.8) * 3) + 0.18;
    bl.addColorStop(0, `rgba(255,220,150,${flare * ce})`); bl.addColorStop(1, 'rgba(255,220,150,0)');
    ctx.fillStyle = bl; ctx.fillRect(x - 220, y - 220, 440, 440);
    ctx.restore();
    ctx.save();
    ctx.globalAlpha = ce;
    ctx.beginPath(); ctx.arc(x, y, 62, 0, Math.PI * 2); ctx.clip();
    ctx.beginPath(); ctx.rect(x - 80, y - 80, 160, 160); ctx.arc(x + 34, y - 22, 54, 0, Math.PI * 2, true);
    ctx.fillStyle = goldGrad(y - 62, y + 62); ctx.fill('evenodd');
    ctx.restore();
  }

  lantern(205, t, 0.85, 300, 0);
  lantern(875, t, 1.05, 240, 1.7);
  mosque(t);

  // Arabic headline — dignified fade + focus pull only
  const ar = io3(seg(t, 1.85, 2.6));
  if (ar > 0) {
    ctx.save();
    ctx.globalAlpha = ar;
    ctx.filter = `blur(${(1 - ar) * 8}px)`;
    ctx.font = '700 104px Amiri';
    ctx.direction = 'rtl'; ctx.textAlign = 'center';
    ctx.fillStyle = goldGrad(375, 485);
    ctx.shadowColor = 'rgba(0,0,0,0.5)'; ctx.shadowBlur = 18; ctx.shadowOffsetY = 6;
    ctx.fillText('جمعة مباركة', CX, 455 + (1 - ar) * 12);
    ctx.restore();
  }
  // ornament divider
  const dv = io3(seg(t, 2.25, 2.85));
  if (dv > 0) {
    ctx.save();
    ctx.strokeStyle = GOLD; ctx.fillStyle = GOLD; ctx.lineWidth = 1.5;
    const w = 150 * dv;
    ctx.beginPath(); ctx.moveTo(CX - 26 - w, 515); ctx.lineTo(CX - 26, 515); ctx.moveTo(CX + 26, 515); ctx.lineTo(CX + 26 + w, 515); ctx.stroke();
    starPath(CX, 515, 13 * dv, 6 * dv, 4, t * 0.5); ctx.fill();
    ctx.restore();
  }
  // Turkish title with mask-rise and a light sweep
  const tr = seg(t, 2.15, 2.85);
  if (tr > 0) {
    const e = io3(tr);
    ctx.save();
    ctx.beginPath(); ctx.rect(0, 530, S, 125); ctx.clip();
    ctx.font = 'italic 600 112px Corm';
    ctx.direction = 'ltr'; ctx.textAlign = 'center';
    const y = 630 + (1 - e) * 70;
    ctx.shadowColor = 'rgba(0,0,0,0.55)'; ctx.shadowBlur = 20; ctx.shadowOffsetY = 6;
    ctx.fillStyle = IVORY;
    ctx.fillText('Hayırlı Cumalar', CX, y);
    ctx.shadowColor = 'transparent';
    // sweep
    const sp = seg(t, 2.75, 3.45);
    if (sp > 0 && sp < 1) {
      const sx = lerp(-200, S + 200, io3(sp));
      const g = ctx.createLinearGradient(sx - 140, 0, sx + 140, 0);
      g.addColorStop(0, 'rgba(255,214,120,0)'); g.addColorStop(0.5, 'rgba(255,224,150,0.95)'); g.addColorStop(1, 'rgba(255,214,120,0)');
      ctx.globalCompositeOperation = 'source-atop';
      ctx.fillStyle = g;
      ctx.fillText('Hayırlı Cumalar', CX, y);
    }
    ctx.restore();
  }
  // subtitle
  const st = io3(seg(t, 3.25, 3.85));
  if (st > 0) {
    ctx.save();
    ctx.globalAlpha = st * 0.85;
    ctx.font = 'italic 500 34px Corm';
    ctx.letterSpacing = `${lerp(6, 1.5, st)}px`;
    ctx.textAlign = 'center'; ctx.fillStyle = GOLD_HI;
    ctx.fillText('Dualarınız kabul, gönlünüz nur olsun', CX, 700);
    ctx.restore();
  }
  // light motes
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  const ma = seg(t, 0.3, 1.5);
  for (const m of MOTES) {
    const y = ((m.y - m.v * t) % S + S) % S, x = m.x + Math.sin(t * 0.8 + m.ph) * 14;
    const tw = 0.6 + 0.4 * Math.sin(t * 3 + m.ph);
    ctx.fillStyle = `rgba(255,214,140,${m.a * tw * ma})`;
    ctx.beginPath(); ctx.arc(x, y, m.s, 0, Math.PI * 2); ctx.fill();
  }
  // 4-point glints (the classic "sparkle", done tastefully)
  for (const [gx, gy, gt] of GLINTS) {
    const k = seg(t, gt, gt + 0.55); if (k <= 0 || k >= 1) continue;
    const a = Math.sin(k * Math.PI);
    ctx.fillStyle = `rgba(255,240,200,${a})`;
    starPath(gx, gy, 26 * a, 2.2 * a, 4, t * 0.6); ctx.fill();
    const g = ctx.createRadialGradient(gx, gy, 0, gx, gy, 18);
    g.addColorStop(0, `rgba(255,220,150,${0.7 * a})`); g.addColorStop(1, 'rgba(255,220,150,0)');
    ctx.fillStyle = g; ctx.fillRect(gx - 18, gy - 18, 36, 36);
  }
  ctx.restore();
}

// render frame f with motion blur (accumulated sub-frames) + grain + vignette
const N = S * S;
const acc = new Float32Array(N * 3);
const out = new Uint8ClampedArray(N * 4);
window.renderFrame = (f, mb = 6) => {
  acc.fill(0);
  for (let i = 0; i < mb; i++) {
    const t = (f + ((i + 0.5) / mb - 0.5) * 0.5) / FPS;
    draw(Math.max(0, t));
    const d = ctx.getImageData(0, 0, S, S).data;
    for (let p = 0, j = 0; p < N * 4; p += 4, j += 3) { acc[j] += d[p]; acc[j + 1] += d[p + 1]; acc[j + 2] += d[p + 2]; }
  }
  const r = rng(f * 9 + 3), k = 1 / mb;
  for (let y = 0; y < S; y++) {
    const dy = (y - 540) / 540;
    for (let x = 0; x < S; x++) {
      const dx = (x - 540) / 540, v = 1 - 0.28 * Math.min(1, (dx * dx + dy * dy) * 0.6);
      const j = (y * S + x) * 3, o = (y * S + x) * 4, n = (r() + r() - 1) * 7;
      out[o] = acc[j] * k * v + n; out[o + 1] = acc[j + 1] * k * v + n; out[o + 2] = acc[j + 2] * k * v + n; out[o + 3] = 255;
    }
  }
  return true;
};
window.capture = async (f) => (await fetch('/frame?f=' + f, { method: 'POST', body: new Blob([out]) })).status;
window.ready = document.fonts.load('700 100px Amiri').then(() => document.fonts.load('italic 600 100px Corm')).then(() => document.fonts.load('600 100px Corm')).then(() => true);
</script></body></html>
